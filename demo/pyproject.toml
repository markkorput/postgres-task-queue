[project]
name = "postgres-task-queue-demo"
version = "0.0.0"
description = "A demo project for the postgres-task-queue library"
readme = "README.md"
authors = [
    { name = "Mark vd Korput", email = "mark.korput@proton.me" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic==1.13.2",
    "async-typer==0.2.1",
    "asyncpg==0.31.0",
    "fastapi==0.136.1",
    "postgres-task-queue==0.1.1",
    "psycopg2==2.9.12",
    "pydantic==2.13.3",
    "sqlalchemy[asyncio]==2.0.35",
    "uvicorn==0.48.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.15.6",
    "ty>=0.0.32",
]
