[project]
name = "postgres-task-queue"
version = "0.0.0"
description = "Basic task queue implementation built on top of pgmq."
readme = "README.md"
license="MIT"
authors = [
    { name = "Mark vd Korput", email = "mark.korput@proton.me" }
]
homepage = "https://github.com/markkorput/postgres-task-queue"
repository = "https://github.com/markkorput/postgres-task-queue"

requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

dependencies = [
    "async-typer==0.2.1",
    "asyncpg>=0.31.0",
    "dependency-injector>=4.49.0",
    "fastapi>=0.136.1",
    "pgmq[async]==1.1.1",
    "pydantic>=2.13.3",
    "typer==0.24.2",
]

[dependency-groups]
dev = [
    "httpx2>=2.2.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-dotenv>=0.5.2",
    "ruff>=0.15.6",
    "ty>=0.0.32",
]

[tool.pytest]
minversion = "9.0"
env_files = [".env.test"]

[tool.ty.src]
exclude = ["demo"]
